name: Organize LeetCode submissions and update README

on:
  push:
    branches:
      - main
    paths:
      - '**.cpp'
      - '**.java'
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.sql'
      - '**.sh'
      - '!.github/**'

# Serialize updates so two submissions cannot push documentation simultaneously.
concurrency:
  group: leetcode-submissions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Process submission commits in this push
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            commits=$(git rev-list --reverse "$AFTER")
          else
            commits=$(git rev-list --reverse "$BEFORE..$AFTER")
          fi
          for commit in $commits; do
            SUBMISSION_COMMIT="$commit" bash .github/workflows/script.sh
          done

      - name: Commit and push organized submissions
        run: |
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: organize LeetCode submissions and update README [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
